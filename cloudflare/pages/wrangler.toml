name = "tsulo-tg-relay"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

[vars]
AMVERA_ORIGIN = "https://sub.tsulo-vpn.ru"
REQUIRED_CHANNEL = "@TsuloVPN"
CHANNEL_URL = "https://t.me/TsuloVPN"
CHANNEL_GATE_ENABLED = "true"
# Secrets (Pages Dashboard / wrangler pages secret put) — не в git:
#   BOT_TOKEN, ADMINS, ADMIN_PANEL_TOKEN
# ADMIN_PANEL_TOKEN должен совпадать с Amvera — иначе /telegram/broadcast → 401
