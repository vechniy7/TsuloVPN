services:
  - type: web
    name: tsulovpn
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        sync: false
      - key: BOT_NAME
        value: TsuloVPN
      - key: SUBSCRIPTION_PUBLIC_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VPN_SOURCE_URL
        sync: false
      - key: SUPPORT_URL
        value: "https://t.me/tsuloew"
      - key: INSTAGRAM_URL
        value: "https://www.instagram.com/tsulo.it"
      - key: DONATE_CARD
        value: "2202209226540747"
      - key: DONATE_CARD_NAME
        value: "АЛИ Ц"
      - key: DONATE_BANK
        value: "Сбербанк"
      - key: PYTHON_VERSION
        value: "3.12.8"
