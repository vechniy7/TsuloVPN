services:
  - type: web
    name: tsulovpn
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        sync: false
      - key: BOT_NAME
        value: TsuloVPN
      - key: SUBSCRIPTION_PUBLIC_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUBSCRIPTION_CONFIG_LIMIT
        value: "45"
      - key: PRIMARY_SUB_URL
        value: "https://subs.eu-fffast.com/3da685c67a5ff43c"
      - key: WIFI_SOURCE_URLS
        value: "https://subs.eu-fffast.com/3da685c67a5ff43c"
      - key: LTE_SOURCE_URLS
        value: "https://subs.eu-fffast.com/3da685c67a5ff43c"
      - key: KEEP_SOURCE_NAMES
        value: "true"
      - key: SUB_FETCH_UA
        value: "Happ/3.5.0"
      - key: SUB_HWID
        value: ""
      - key: SUB_DEVICE_OS
        value: "Linux"
      - key: SUB_DEVICE_OS_VER
        value: "6.1"
      - key: SUB_DEVICE_MODEL
        value: "TsuloVPN-Server"
      - key: POOL_REFRESH_INTERVAL
        value: "300"
      - key: HAPP_ENCRYPT_SUBSCRIPTION
        value: "true"
      - key: CARDLINK_API_TOKEN
        sync: false
      - key: CARDLINK_SHOP_ID
        sync: false
      - key: CARDLINK_PAYMENT_METHOD
        value: SBP
      - key: PAYMENTS_ENFORCE
        value: "false"
      - key: SUPPORT_URL
        value: "https://t.me/tsuloew"
      - key: INSTAGRAM_URL
        value: "https://www.instagram.com/tsulo.it"
      - key: DONATE_CARD
        value: "2202209226540747"
      - key: DONATE_CARD_NAME
        value: "АЛИ Ц"
      - key: DONATE_BANK
        value: "Сбербанк"
      - key: PYTHON_VERSION
        value: "3.12.8"
