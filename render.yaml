services:
  - type: web
    name: tsulovpn
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        sync: false
      - key: BOT_NAME
        value: TsuloVPN
      - key: SUBSCRIPTION_PUBLIC_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUBSCRIPTION_CONFIG_LIMIT
        value: "45"
      - key: LIDERVPN_SUB_URL
        value: "https://sub.lidervpn.com/yxJC39WYm7Zubz1U"
      - key: WIFI_SOURCE_URLS
        value: "https://sub.lidervpn.com/yxJC39WYm7Zubz1U,https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
      - key: LTE_SOURCE_URLS
        value: "https://sub.lidervpn.com/yxJC39WYm7Zubz1U,https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
      - key: SUB_HWID
        value: "tsulovpn-04fe756bc19238ad"
      - key: SUB_DEVICE_OS
        value: "Linux"
      - key: SUB_DEVICE_OS_VER
        value: "6.1"
      - key: SUB_DEVICE_MODEL
        value: "TsuloVPN-Server"
      - key: SUB_FETCH_UA
        value: "Happ/3.5.0"
      - key: POOL_REFRESH_INTERVAL
        value: "300"
      - key: HAPP_ENCRYPT_SUBSCRIPTION
        value: "true"
      - key: CARDLINK_API_TOKEN
        sync: false
      - key: CARDLINK_SHOP_ID
        sync: false
      - key: CARDLINK_PAYMENT_METHOD
        value: SBP
      - key: PAYMENTS_ENFORCE
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.8"
