<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TsuloVPN · Панель</title>
  <link rel="stylesheet" href="/panel/static/panel.css?v=4" />
</head>
<body>
  <div id="login-view" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-brand">Tsulo<span>VPN</span></div>
      <p class="login-sub">Админ-панель</p>
      <label>Токен доступа</label>
      <input id="login-token" type="password" autocomplete="current-password" placeholder="ADMIN_PANEL_TOKEN" required />
      <button type="submit">Войти</button>
      <p id="login-error" class="error"></p>
      <p class="hint">Задайте <code>ADMIN_PANEL_TOKEN</code> в Amvera</p>
    </form>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">Tsulo<span>VPN</span></div>
      <nav>
        <button data-view="dashboard" class="nav active">Обзор</button>
        <button data-view="users" class="nav">Пользователи</button>
        <button data-view="orders" class="nav">Платежи</button>
        <button data-view="nodes" class="nav">Ноды / пул</button>
        <button data-view="settings" class="nav">Настройки</button>
      </nav>
      <button id="btn-logout" class="logout">Выйти</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Обзор</h1>
        <div class="top-actions">
          <span id="badge-payments" class="badge">оплата</span>
          <button id="btn-refresh" class="ghost">Обновить</button>
        </div>
      </header>

      <section id="view-dashboard" class="view">
        <div class="cards" id="dash-cards"></div>
        <div class="grid-2">
          <div class="card">
            <h3>Пул / ноды</h3>
            <div id="dash-pool" class="muted">…</div>
          </div>
          <div class="card">
            <h3>Тарифы</h3>
            <div id="dash-plans" class="muted">…</div>
          </div>
        </div>
      </section>

      <section id="view-users" class="view hidden">
        <div class="toolbar">
          <input id="users-q" type="search" placeholder="Поиск: id, @user, имя, token…" />
          <select id="users-status">
            <option value="">Все статусы</option>
            <option value="active">активен</option>
            <option value="expired">истёк</option>
            <option value="disabled">отключён</option>
            <option value="admin">админ</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Пользователь</th>
                <th>Статус</th>
                <th>До</th>
                <th>Устр.</th>
                <th>Обновления</th>
                <th>Был</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="users-prev" class="ghost">←</button>
          <span id="users-page">1</span>
          <button id="users-next" class="ghost">→</button>
        </div>
      </section>

      <section id="view-orders" class="view hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Заказ</th>
                <th>Пользователь</th>
                <th>План</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Создан</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </section>

      <section id="view-nodes" class="view hidden">
        <div class="toolbar">
          <button id="btn-pool-refresh" class="primary">Обновить пул</button>
        </div>
        <div class="card" id="nodes-detail"></div>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="card">
          <h3>Сервис</h3>
          <div id="settings-box" class="kv"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="user-modal">
    <form method="dialog" id="user-form" class="modal">
      <header>
        <h2 id="modal-title">Пользователь</h2>
        <button type="button" id="modal-close" class="ghost">✕</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <div class="device-row">
        <label>Лимит устройств</label>
        <select id="modal-device-limit">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <button type="button" data-act="set-devices" class="primary">Сохранить лимит</button>
      </div>
      <div class="modal-actions">
        <button type="button" data-act="extend5m" class="ghost">+5 мин</button>
        <button type="button" data-act="extend7" class="ghost">+7 дней</button>
        <button type="button" data-act="extend30" class="primary">+30 дней</button>
        <button type="button" data-act="extend180" class="ghost">+полгода</button>
        <button type="button" data-act="extend365" class="ghost">+год</button>
        <button type="button" data-act="expire" class="ghost">Снять доступ</button>
        <button type="button" data-act="disable" class="danger">Отключить</button>
        <button type="button" data-act="enable" class="ghost">Включить</button>
        <button type="button" data-act="regen" class="danger">Новый ключ</button>
        <button type="button" data-act="reset-hwid" class="ghost">Сброс HWID</button>
        <button type="button" data-act="copy" class="ghost">Копировать URL</button>
      </div>
      <label class="note-label">Заметка</label>
      <div class="note-row">
        <input id="modal-note" type="text" maxlength="500" />
        <button type="button" data-act="note" class="ghost">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="/panel/static/panel.js?v=4"></script>
</body>
</html>
