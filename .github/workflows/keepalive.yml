# Внешний пинг Render Free. Внутренние health-check Render НЕ мешают hibernate.
#
# ВАЖНО: GitHub schedule часто опаздывает/пропускает запуски.
# Надёжнее: UptimeRobot каждые 5 мин → https://tsulovpn.onrender.com/health
# (см. README / инструкцию в чате)
#
# Лимит Render Free: ~750 ч/мес ≈ 1 сервис 24/7.
name: Keep Render awake

on:
  schedule:
    # каждые 5 минут (UTC) — запас до idle 15 мин
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health (external traffic)
        env:
          APP_URL: ${{ vars.APP_URL != '' && vars.APP_URL || 'https://tsulovpn.onrender.com' }}
        run: |
          URL="${APP_URL%/}/health"
          echo "GET $URL at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          code="000"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 100 "$URL" || true)
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 400 /tmp/health.json || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "Keep-alive failed after retries (service may be cold). Next run will retry."
          exit 0
